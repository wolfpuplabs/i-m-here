<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Lokasi Peserta</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f4f9; 
            margin: 0;
        }
        .container { 
            max-width: 400px; 
            margin: 20px auto; 
            background: white; 
            padding: 25px 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
        }
        button:hover { 
            background-color: #0056b3; 
        }
        /* Desain khusus untuk tombol berhenti */
        #btnStop {
            background-color: #dc3545; 
            display: none; /* Disembunyikan di awal */
        }
        #btnStop:hover {
            background-color: #c82333;
        }
        #status { 
            margin-top: 15px; 
            color: #555; 
            font-size: 14px; 
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>I'm Here</h2>
    <p>Aktifkan GPS (Lokasi) di HP Anda, masukkan nama, lalu klik tombol di bawah.</p>
    
    <input type="text" id="nama_peserta" placeholder="Masukkan Nama Anda (Cth: Budi)" required>
    
    <button id="btnBagikan">Start</button>
    <!-- Tombol Berhenti ditambahkan di sini -->
    <button id="btnStop">Stop</button>

    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // 1. MASUKKAN FIREBASE CONFIG ANDA DI SINI
    const firebaseConfig = {
        apiKey: "AIzaSyCkk5gSI5Ura1zTElaCIJiSsNI33QeBLFA",
  authDomain: "imhere-eba76.firebaseapp.com",
  databaseURL: "https://imhere-eba76-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "imhere-eba76",
  storageBucket: "imhere-eba76.firebasestorage.app",
  messagingSenderId: "964549084043",
  appId: "1:964549084043:web:a5176dc4055d93acc0658e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let watcherId = null;

    const btnBagikan = document.getElementById("btnBagikan");
    const btnStop = document.getElementById("btnStop");
    const statusDiv = document.getElementById("status");
    const inputNama = document.getElementById("nama_peserta");

    // FUNGSI MULAI
    btnBagikan.addEventListener("click", () => {
        const nama = inputNama.value.trim();

        if (!nama) {
            alert("Harap masukkan nama Anda terlebih dahulu!");
            return;
        }

        if (navigator.geolocation) {
            statusDiv.innerHTML = "<i>Meminta izin akses GPS...</i>";
            
            // Ubah tampilan tombol
            btnBagikan.style.display = "none";
            btnStop.style.display = "block";
            inputNama.disabled = true;

            watcherId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const waktu = new Date().toLocaleTimeString('id-ID');

                    set(ref(db, 'peserta_travel/' + nama), {
                        lat: lat,
                        lon: lon,
                        waktu: waktu
                    }).then(() => {
                        statusDiv.innerHTML = `<span style="color: #28a745;"><b>Berhasil!</b><br>Lokasi Anda terus diperbarui secara otomatis.<br><br><small>Update Terakhir: ${waktu}</small></span>`;
                    });
                }, 
                (error) => {
                    statusDiv.innerHTML = `<span style="color: red;">Gagal melacak lokasi. Pastikan GPS menyala.</span>`;
                    kembalikanTampilan();
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );

            // Mendengarkan jika admin mematikan paksa (fitur sebelumnya)
            const userRef = ref(db, 'peserta_travel/' + nama);
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.forceStop === true) {
                    hentikanPelacakan("<b>Berhenti!</b><br>Pelacakan lokasi Anda telah dimatikan oleh Admin.");
                }
            });

        } else {
            statusDiv.innerHTML = "Browser HP Anda tidak mendukung pelacakan lokasi.";
        }
    });

    // FUNGSI BERHENTI (Ditekan oleh Peserta)
    btnStop.addEventListener("click", () => {
        const nama = inputNama.value.trim();
        
        // Hentikan pelacakan di HP
        hentikanPelacakan("<b>Berhenti!</b><br>Anda telah menghentikan pelacakan lokasi.");
        
        // Opsional: Beritahu database bahwa peserta berhenti (agar muncul info di peta admin)
        if (nama) {
            update(ref(db, 'peserta_travel/' + nama), {
                waktu: "Berhenti membagikan lokasi"
            });
        }
    });

    // Fungsi bantuan untuk menghentikan GPS
    function hentikanPelacakan(pesan) {
        if (watcherId !== null) {
            navigator.geolocation.clearWatch(watcherId);
            watcherId = null;
        }
        statusDiv.innerHTML = `<span style="color: red;">${pesan}</span>`;
        kembalikanTampilan();
    }

    // Fungsi bantuan untuk mereset tombol
    function kembalikanTampilan() {
        btnBagikan.style.display = "block";
        btnStop.style.display = "none";
        inputNama.disabled = false;
    }
</script>

</body>
</html>
