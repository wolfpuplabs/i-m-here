<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Lokasi Peserta</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f4f9; 
            margin: 0;
        }
        .container { 
            max-width: 400px; 
            margin: 20px auto; 
            background: white; 
            padding: 25px 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
        }
        button:hover { 
            background-color: #0056b3; 
        }
        #status { 
            margin-top: 15px; 
            color: #555; 
            font-size: 14px; 
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bagikan Lokasi Live</h2>
    <p>Aktifkan GPS (Lokasi) di HP Anda, masukkan nama, lalu klik tombol di bawah.</p>
    
    <input type="text" id="nama_peserta" placeholder="Masukkan Nama Anda (Cth: Budi)" required>
    <button id="btnBagikan">Mulai Bagikan Lokasi</button>

    <div id="status"></div>
</div>

<script type="module">
    // Menggunakan Firebase Modular SDK (v10)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // 1. MASUKKAN FIREBASE CONFIG ANDA DI SINI
    const firebaseConfig = {
        apiKey: "API_KEY_ANDA",
        authDomain: "PROYEK_ANDA.firebaseapp.com",
        databaseURL: "https://PROYEK_ANDA-default-rtdb.firebaseio.com", // WAJIB ADA
        projectId: "PROYEK_ANDA",
        storageBucket: "PROYEK_ANDA.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let watcherId = null;

    document.getElementById("btnBagikan").addEventListener("click", () => {
        const nama = document.getElementById("nama_peserta").value.trim();
        const statusDiv = document.getElementById("status");

        if (!nama) {
            alert("Harap masukkan nama Anda terlebih dahulu!");
            return;
        }

        if (navigator.geolocation) {
            statusDiv.innerHTML = "<i>Meminta izin akses GPS...<br>(Mohon izinkan jika ada pop-up dari browser)</i>";
            
            // Menonaktifkan tombol agar tidak diklik berkali-kali
            document.getElementById("btnBagikan").disabled = true;
            document.getElementById("btnBagikan").style.backgroundColor = "#6c757d";

            // Melacak posisi secara real-time
            watcherId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const waktu = new Date().toLocaleTimeString('id-ID');

                    // Mengirim data ke Realtime Database
                    set(ref(db, 'peserta_travel/' + nama), {
                        lat: lat,
                        lon: lon,
                        waktu: waktu
                    }).then(() => {
                        statusDiv.innerHTML = `<span style="color: #28a745;"><b>Berhasil!</b><br>Lokasi Anda terus diperbarui secara otomatis. Biarkan halaman ini tetap terbuka.<br><br><small>Update Terakhir: ${waktu}</small></span>`;
                    }).catch((error) => {
                        statusDiv.innerHTML = `<span style="color: red;">Gagal mengirim data: ${error.message}</span>`;
                    });
                }, 
                (error) => {
                    statusDiv.innerHTML = `<span style="color: red;"><b>Gagal melacak lokasi.</b><br>Pastikan GPS menyala dan Anda telah memberikan izin akses lokasi pada browser ini.</span>`;
                    document.getElementById("btnBagikan").disabled = false;
                    document.getElementById("btnBagikan").style.backgroundColor = "#007bff";
                },
                { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
            );
        } else {
            document.getElementById("status").innerHTML = "Browser HP Anda tidak mendukung fitur pelacakan lokasi.";
        }
    });
</script>

</body>
</html>
